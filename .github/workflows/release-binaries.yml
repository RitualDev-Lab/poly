name: Release Native Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.5.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Standalone Multi-Arch Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime & Compiler
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Compile Multi-Arch Native Executables
        run: |
          mkdir -p dist-bin release
          
          echo "Building Linux x64..."
          bun build --compile --minify --target=bun-linux-x64 ./src/cli.ts --outfile dist-bin/poly-linux-x64
          
          echo "Building Linux arm64..."
          bun build --compile --minify --target=bun-linux-arm64 ./src/cli.ts --outfile dist-bin/poly-linux-arm64
          
          echo "Building macOS x64..."
          bun build --compile --minify --target=bun-darwin-x64 ./src/cli.ts --outfile dist-bin/poly-darwin-x64
          
          echo "Building macOS arm64..."
          bun build --compile --minify --target=bun-darwin-arm64 ./src/cli.ts --outfile dist-bin/poly-darwin-arm64
          
          echo "Building Windows x64..."
          bun build --compile --minify --target=bun-windows-x64 ./src/cli.ts --outfile dist-bin/poly-windows-x64.exe

      - name: Package Release Archives & Generate Checksums
        run: |
          # 1. Linux x64
          mkdir -p tmp && cp dist-bin/poly-linux-x64 tmp/poly
          tar -czf release/poly-linux-x64.tar.gz -C tmp poly
          rm -rf tmp

          # 2. Linux arm64
          mkdir -p tmp && cp dist-bin/poly-linux-arm64 tmp/poly
          tar -czf release/poly-linux-arm64.tar.gz -C tmp poly
          rm -rf tmp

          # 3. macOS x64
          mkdir -p tmp && cp dist-bin/poly-darwin-x64 tmp/poly
          tar -czf release/poly-darwin-x64.tar.gz -C tmp poly
          rm -rf tmp

          # 4. macOS arm64
          mkdir -p tmp && cp dist-bin/poly-darwin-arm64 tmp/poly
          tar -czf release/poly-darwin-arm64.tar.gz -C tmp poly
          rm -rf tmp

          # 5. Windows x64
          mkdir -p tmp && cp dist-bin/poly-windows-x64.exe tmp/poly.exe
          cd tmp && zip -9 ../release/poly-windows-x64.zip poly.exe && cd ..
          rm -rf tmp

          # 6. Checksums
          cd release
          sha256sum poly-*.tar.gz poly-*.zip > checksums.txt
          cat checksums.txt

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release/poly-linux-x64.tar.gz
            release/poly-linux-arm64.tar.gz
            release/poly-darwin-x64.tar.gz
            release/poly-darwin-arm64.tar.gz
            release/poly-windows-x64.zip
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
